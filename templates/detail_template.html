<div style="width: 100%; margin: 60px 0px; display: flex; justify-content: center;">
  <div style="max-width: 720px; display: flex; flex-direction: column;">

    <!-- TOP IMAGE -->
    <div style="text-align:center">
      <img src="{{TOP_IMAGE}}" style="max-width: 100%; object-fit: contain;">
    </div>

    <!-- PRODUCT NAME (TOP 바로 아래에 위치) -->
    <div style="text-align:center; margin-top: 150px; margin-bottom: 150px;">
      <span style="font-size: 1.5em">{{PRODUCT_NAME}}</span>
    </div>

    <!-- PRODUCT IMAGES -->
    {{PRODUCT_IMAGES}}

    <div style="text-align:center"><br></div>
    <div style="text-align:center"><br></div>

    <!-- DESCRIPTION SECTION -->
    {{DESCRIPTION_SECTION}}

    <!-- SIZE_CHART_SECTION -->
    {{SIZE_CHART_SECTION}}

    <!-- OPTIONS SECTION -->
    {{OPTIONS_SECTION}}

    <!-- DIVIDER -->
    <div style="text-align:center">
      <div style="height:1px;width:220px;min-height:1px;min-width:220px;
                  margin-top:60px;margin-bottom:60px;
                  margin-left:auto;margin-right:auto;
                  background-color:#ddd;"></div>
    </div>
    <!-- BOTTOM IMAGE -->
    <div style="text-align:center">
      <img src="{{BOTTOM_IMAGE}}" style="max-width: 100%; object-fit: contain;">
    </div>

  </div>
</div>
